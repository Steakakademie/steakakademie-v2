# Steakakademie — Affiliate-Programm-Registry
# Partnerprogramme als first-class Entität. Produkte (registry.yaml) verweisen über
# ihr provider-Feld auf das passende Programm (program.providers).
#
# status: planned (geplant) | applied (beworben, Freigabe ausstehend) | active (live)
# Strategie: hochpreisige Grills über deutsche Fachhändler (hoher €-Betrag/Sale)
#            + günstige Gadgets optional über Banggood.
# Bereinigt 2026-10-12: 360° BBQ, Grill-Experte, Banggood und BURNHARD entfernt (seit 02.06.2026 ungeprüft, keine Zusage;
#   BURNHARD von Uwe am 25.09.2026 bewusst nicht aufgenommen). /affiliate-disclosure zeigt jedes Programm, das nicht `active`
#   ist, öffentlich als „in Vorbereitung“ — hier steht deshalb nur, wofür eine Zusage oder Bewerbung vorliegt.
# AWIN-Einträge ergänzt 2026-10-10, Bremer Gewürzhandel 2026-10-12

- id: amazon
  name: "Amazon Partnerprogramm"
  network: "Amazon PartnerNet (Direktprogramm)"
  providers: [amazon]
  commission: "bis 10 % (kategorieabhängig)"
  cookie: "24 Stunden"
  avgCartEur: null
  status: active
  applyUrl: "https://partnernet.amazon.de"
  focus: "Breites Sortiment — Thermometer, Messer, Zubehör, Sous-vide"
  channels: { blog: true, socialOrganic: true, paidAds: false }
  disclosureNote: "Als Amazon-Partner verdiene ich an qualifizierten Verkäufen."

