# Kriterienkatalog für den PM-Status-Generator
#
# Doku und Begründung: docs/pm-status-generator.md
# Generator:           scripts/generate-pm-context.mjs
#
# REGELN (kurz — die lange Fassung steht in der Doku):
#  1. Jedes Kriterium ist ein SATZ, der falsch sein kann. Keine Substantive.
#     Falsch: "Supabase".  Richtig: "Jeder Avatar-Zustand hat ein Video-Asset."
#  2. Jedes Kriterium stützt sich auf GENAU EINEN interpretationsfreien Fakt.
#  3. Drei Zustände: erfuellt / nicht_erfuellt / nicht_messbar.
#     Nicht messbar heißt: fällt aus dem Nenner. NICHT: zählt als nicht erfüllt.
#  4. `pruefung` verweist auf eine Prüf-ID im Generator. Fehlt sie dort,
#     bricht der Lauf ab — ein Kriterium darf nicht still verschwinden.
#  5. `netz: true` markiert Prüfungen, die ohne Netz `nicht_messbar` ergeben.

version: 1

bereiche:
  - name: Avatar-System
    beschreibung: >-
      KI-Redaktionspersonas, ihre Assets und die rechtliche Kennzeichnung.
      Der Nenner steht im Code: der Zustandsautomat definiert die Zustände,
      authors.ts die Personas.
    kriterien:
      - id: personas-angelegt
        frage: Alle drei KI-Personas (Marco, Jonas, Elena) sind in authors.ts angelegt.
        pruefung: personas-angelegt

      - id: avatar-pfade-aufloesbar
        frage: Jeder in authors.ts referenzierte avatar-Pfad zeigt auf eine existierende Datei.
        pruefung: avatar-pfade-aufloesbar

      - id: marco-portraet
        frage: Marcos Porträtbild liegt unter public/images/authors/marco-richter.jpg.
        pruefung: datei-vorhanden
        datei: public/images/authors/marco-richter.jpg

      - id: marco-rueckenansicht
        frage: Marcos Rückenansicht (Normalzustand am Grill) liegt unter public/images/marco-back.jpg.
        pruefung: datei-vorhanden
        datei: public/images/marco-back.jpg

      - id: zustand-videos-vollstaendig
        frage: Jeder sichtbare Zustand des Avatar-Automaten hat ein Video-Asset.
        pruefung: zustand-videos-vollstaendig

      - id: rotations-vollstaendig
        frage: ROTATIONS in MarcoAvatar.tsx deckt jeden Zustand des Automaten ab.
        pruefung: rotations-vollstaendig

      - id: autorenseiten-route
        frage: Die Autorenseite /autoren/[slug] existiert als Route.
        pruefung: pfad-vorhanden
        datei: src/app/autoren/[slug]

      - id: ki-disclaimer-route
        frage: Die Seite /ki-disclaimer existiert als Route.
        pruefung: pfad-vorhanden
        datei: src/app/ki-disclaimer

      - id: avatar-leitlinie-dokumentiert
        frage: Die Avatar-Leitlinie ist in docs/avatare/marco.md festgehalten.
        pruefung: datei-vorhanden
        datei: docs/avatare/marco.md

      # Hintergrund: Am 09.08.2026 behaupteten die Personas-Bios gelebte
      # Erfahrung ("testet alle Produkte selbst", "über 15 Jahren Grillpraxis")
      # direkt neben Affiliate-Empfehlungen — als irreführende geschäftliche
      # Handlung nach UWG korrigiert. Dieses Kriterium hält den Zustand.
      - id: bios-ohne-erfahrungsbehauptung
        frage: Keine KI-Persona-Bio behauptet selbst gelebte Erfahrung oder eigene Produkttests.
        pruefung: bios-ohne-erfahrungsbehauptung

  - name: Tech-Stack & Tools
    beschreibung: >-
      Zustand von Abhängigkeiten, Typprüfung und Build-Konfiguration.
      Nahezu vollständig aus npm- und tsc-Ausgaben ableitbar.
    kriterien:
      - id: typecheck-fehlerfrei
        frage: tsc --noEmit läuft fehlerfrei durch.
        pruefung: typecheck-fehlerfrei

      - id: tsconfig-strict
        frage: TypeScript läuft im strict-Modus.
        pruefung: tsconfig-strict

      - id: audit-keine-critical
        frage: npm audit meldet keine Schwachstelle der Stufe critical.
        pruefung: audit-schwelle
        stufe: critical

      - id: audit-keine-high
        frage: npm audit meldet keine Schwachstelle der Stufe high.
        pruefung: audit-schwelle
        stufe: high

      - id: env-example-vollstaendig
        frage: .env.example dokumentiert jede im Code referenzierte Umgebungsvariable.
        pruefung: env-example-vollstaendig

      - id: deploy-konfig-eindeutig
        frage: Es liegt genau eine Deploy-Konfiguration im Repo (netlify.toml oder vercel.json, nicht beide).
        pruefung: deploy-konfig-eindeutig

      - id: deploy-konfig-passt-zum-hoster
        frage: Die Deploy-Konfiguration im Repo passt zu dem Hoster, der die Live-Seite ausliefert.
        pruefung: deploy-konfig-passt-zum-hoster
        netz: true

      - id: modell-ids-gepinnt
        frage: Jede verwendete Claude-Modell-ID ist auf eine konkrete Version gepinnt.
        pruefung: modell-ids-gepinnt

      - id: node-engine-deklariert
        frage: package.json deklariert eine engines.node-Spanne.
        pruefung: node-engine-deklariert

      - id: lockfile-synchron
        frage: package-lock.json ist mit package.json synchron.
        pruefung: lockfile-synchron

  - name: Content-Strategie
    beschreibung: >-
      Gemessen wird ausschließlich die BESCHAFFENHEIT des Bestands, nie sein
      Umfang. „Wie viele Rezepte sind genug" steht nirgends im Repo — jede Zahl
      dafür wäre geraten und würde den alten Fehler wiederholen.
      Vollständigkeit, Konsistenz und Auflösbarkeit dagegen sind ohne
      Zielvorgabe prüfbar. Wenn später eine Keyword-Map oder ein
      Redaktionsplan als Datei existiert, kann Umfang dazukommen.
    kriterien:
      - id: frontmatter-parsebar
        frage: Jede Inhaltsdatei hat lesbares Frontmatter.
        pruefung: frontmatter-parsebar

      # Vorgeschichte: memory.md 11.08.2026 dokumentiert den umgekehrten Fall —
      # eine .ps1 OHNE BOM zerlegte den PowerShell-Parser. Kodierung ist in
      # diesem Repo eine bekannte Fehlerquelle, nicht Kosmetik.
      - id: kein-bom-in-content
        frage: Keine Inhaltsdatei beginnt mit einem UTF-8-BOM.
        pruefung: kein-bom-in-content

      - id: bildpfade-aufloesbar
        frage: Jeder im Frontmatter angegebene Bildpfad zeigt auf eine existierende Datei.
        pruefung: bildpfade-aufloesbar
        bildfelder: [image, bild, heroImage, heroBild, cover, thumbnail]

      # Bewusst nur bebilderte Kollektionen. Glossar und Diplom-Lektionen sind
      # Textformate — dort ein Bild zu verlangen waere eine erfundene
      # Anforderung (Regel 5).
      - id: bildabdeckung-visuelle-kollektionen
        frage: Jeder Eintrag in einer bebilderten Kollektion hat ein Bild.
        pruefung: bildabdeckung-visuelle-kollektionen
        kollektionen: [rezepte, methoden, cuts, usa, vergleich]
        bildfelder: [image, bild, heroImage, heroBild, cover, thumbnail]

      - id: bildbeschreibung-wo-bild
        frage: Jedes Bild im Frontmatter hat einen Alternativtext.
        pruefung: bildbeschreibung-wo-bild
        bildfelder: [image, bild, heroImage, heroBild, cover, thumbnail]
        altfelder: [imageAlt, bildAlt, alt, heroImageAlt]

      - id: beschreibungsfeld-einheitlich
        frage: Jeder Inhalt nutzt dasselbe Feld für die Suchmaschinen-Beschreibung.
        pruefung: beschreibungsfeld-einheitlich
        feld: seoDescription
        alternativen: [description, excerpt]

      # 160 Zeichen ist eine gesetzte Grenze (Google kuerzt dort ab), keine
      # gemessene Wahrheit — sie steht hier sichtbar und ist diskutierbar.
      - id: beschreibung-nicht-zu-lang
        frage: Keine Suchmaschinen-Beschreibung ist länger als 160 Zeichen.
        pruefung: beschreibung-nicht-zu-lang
        felder: [seoDescription, description]
        maxZeichen: 160

      - id: autorslug-aufloesbar
        frage: Jeder authorSlug im Inhalt verweist auf eine existierende Persona.
        pruefung: autorslug-aufloesbar

      - id: keine-slug-kollisionen
        frage: Innerhalb einer Kollektion kommt kein Slug doppelt vor.
        pruefung: keine-slug-kollisionen

      - id: publishedat-nicht-in-zukunft
        frage: Kein Inhalt trägt ein Veröffentlichungsdatum in der Zukunft.
        pruefung: publishedat-nicht-in-zukunft

  - name: SEO & Traffic
    beschreibung: >-
      Auffindbarkeit und ihre technische Grundlage. Der Bereich misst die
      Struktur, NICHT den Traffic — dafür fehlt eine serverseitig angebundene
      Datenquelle. Genau das ist als eigenes Kriterium erfasst, statt den
      Bereich stillschweigend kleiner zu machen als er ist.
    kriterien:
      # Bewusst nur indexierbare Seiten: /admin/, /auth/, /profil und weitere
      # sind in robots.txt gesperrt bzw. in next-sitemap.config.js
      # ausgeschlossen. Beide Listen werden zur Laufzeit gelesen, nicht
      # hartkodiert — sonst driftet das Kriterium von der Wirklichkeit weg.
      - id: indexierbare-seiten-mit-metadata
        frage: Jede indexierbare Seite hat Metadata.
        pruefung: indexierbare-seiten-mit-metadata

      - id: jedes-rezept-in-sitemap
        frage: Jedes Rezept im Repo hat einen Eintrag in der Live-Sitemap.
        pruefung: jedes-rezept-in-sitemap
        netz: true

      - id: robots-verweist-auf-sitemap
        frage: robots.txt nennt die Sitemap.
        pruefung: robots-verweist-auf-sitemap

      - id: gsc-verifiziert
        frage: Die Search-Console-Verifikation liegt als DNS-TXT-Record vor.
        pruefung: gsc-verifiziert
        netz: true

      # GEO-Strategie: Answer-Engine-Crawler sind ausdruecklich erwuenscht,
      # nicht nur geduldet (CLAUDE.md, docs/geo-llm-ranking-factors.md).
      - id: ki-crawler-ausdruecklich-erlaubt
        frage: robots.txt adressiert die Answer-Engine-Crawler ausdrücklich.
        pruefung: ki-crawler-ausdruecklich-erlaubt
        crawler: [GPTBot, OAI-SearchBot, ClaudeBot, PerplexityBot, Google-Extended, CCBot]

      - id: strukturierte-daten-in-rezeptvorlage
        frage: Die Rezeptvorlage gibt strukturierte Daten als JSON-LD aus.
        pruefung: datei-enthaelt
        datei: src/components/RecipeTemplate.tsx
        enthaelt: ['application/ld+json']

      # canonical wird global im Root-Layout gesetzt; Seiten ueberschreiben es
      # bei Bedarf. Ein Pro-Seite-Kriterium waere deshalb falsch.
      - id: canonical-basis-gesetzt
        frage: Das Root-Layout setzt metadataBase und einen Standard-Canonical.
        pruefung: datei-enthaelt
        datei: src/app/layout.tsx
        enthaelt: [metadataBase, 'canonical']

      - id: og-bildroute-vorhanden
        frage: Die OG-Bildroute für Social-Vorschauen existiert.
        pruefung: pfad-vorhanden
        datei: src/app/api/og

      - id: geo-check-gruen
        frage: Der Workflow "GEO-Check" ist zuletzt erfolgreich gelaufen.
        pruefung: workflow-zuletzt-gruen
        workflow: GEO-Check
        netz: true

      # Plausible und Clarity laufen im Browser — der Generator kommt an ihre
      # Zahlen nicht heran. Solange keine serverseitige Quelle angebunden ist,
      # ist jede Traffic-Aussage im Dashboard eine Behauptung.
      - id: traffic-datenquelle-angebunden
        frage: Eine serverseitige Traffic-Datenquelle ist angebunden (Search Console, GA4 oder Plausible-API).
        pruefung: traffic-datenquelle-angebunden
        # Marker fuer das LESEN von Statistik. Nicht aufnehmen:
        # plausible.io/api/event — das senden die /go-Redirects, es ist
        # Ereignis-Versand und liefert dem Generator keine einzige Zahl.
        marker:
          - searchconsole
          - webmasters.googleapis.com
          - BetaAnalyticsDataClient
          - analyticsdata.googleapis.com
          - plausible.io/api/v1/stats
          - plausible.io/api/v2/query

  - name: Kurse & Diplom-System
    beschreibung: >-
      Lektionsbestand, Struktur und die Verdrahtung von Fortschritt und
      Freischaltung. Bewusst NICHT geprüft: ob Lektionen zugriffsgeschützt
      sind — jede trägt seoTitle und seoDescription, sie sind also absichtlich
      öffentlich (Regel 5).
    kriterien:
      - id: lektionsraster-vollstaendig
        frage: Jede Diplom-Stufe hat gleich viele Lektionen, das Raster ist lückenlos.
        pruefung: lektionsraster-vollstaendig

      - id: lektions-order-eindeutig
        frage: Innerhalb einer Stufe vergibt keine Lektion eine doppelte order.
        pruefung: lektions-order-eindeutig

      - id: lektionslugs-eindeutig
        frage: Kein lektionSlug kommt doppelt vor.
        pruefung: lektionslugs-eindeutig

      - id: lektions-pflichtfelder
        frage: Jede Lektion hat alle didaktischen und SEO-Pflichtfelder im Frontmatter.
        pruefung: lektions-pflichtfelder
        felder:
          [title, stufe, order, lektionSlug, excerpt, merksatz, publishedAt,
           seoTitle, seoDescription]

      - id: medaillenbilder-vorhanden
        frage: Jede in Medal.tsx referenzierte Medaille hat ihre Bilddatei.
        pruefung: medaillenbilder-vorhanden

      # Gleiche Krankheit wie bei den Modell-IDs: verstreute Definitionen
      # driften auseinander. roadmap/page.tsx und die Lernroute (STUFE_META)
      # beschreiben beide dieselben fuenf Stufen, unabhaengig voneinander.
      - id: stufen-zentral-definiert
        frage: Die Diplom-Stufen sind zentral definiert, nicht in mehreren Komponenten dupliziert.
        pruefung: stufen-zentral-definiert
        zentraleDatei: src/lib/diplom-stufen.ts
        muster: "STUFE_META|title: 'Der Funke'"
        verdaechtige:
          - src/app/diplome/roadmap/page.tsx
          - src/app/diplome/lernen/[stufe]/[lektion]/page.tsx

      - id: fortschritt-migriert
        frage: Die Fortschritts-Tabellen liegen als Supabase-Migration vor.
        pruefung: datei-vorhanden
        datei: supabase/migrations/20260603_course_progress_profiles.sql

      - id: kurszugriff-migriert
        frage: Die Zugriffsregel für Kursinhalte liegt als Supabase-Migration vor.
        pruefung: datei-vorhanden
        datei: supabase/migrations/010_course_access_policy.sql

      - id: urkunden-route
        frage: Die Urkunden-Seite existiert als Route.
        pruefung: pfad-vorhanden
        datei: src/app/diplome/urkunde

      - id: badge-bildroute
        frage: Die OG-Badge-Route für Diplom-Nachweise existiert.
        pruefung: pfad-vorhanden
        datei: src/app/api/og/badge

  - name: KI-System & Automation
    beschreibung: >-
      Wie die KI-Aufrufe organisiert sind und ob die Automatisierung die
      nicht-verhandelbaren Regeln einhält — insbesondere Regel 4 (human-gated)
      und Regel 8c (Fakten gegen die kanonische Referenz).
    kriterien:
      # Abgrenzung zu "modell-ids-gepinnt" im Bereich Tech-Stack: dort geht es
      # um die Version, hier um den Ort. Verstreute Literale sind der Grund,
      # warum die Schreibweisen ueberhaupt auseinanderdriften konnten.
      - id: zentrale-modell-definition
        frage: Die Claude-Modell-IDs stehen an einer zentralen Stelle statt als Literale im Code verstreut.
        pruefung: zentrale-modell-definition
        zentraleDatei: src/lib/ai-modelle.ts

      - id: jeder-workflow-hat-trigger
        frage: Jeder Workflow im Repo hat mindestens einen Trigger.
        pruefung: jeder-workflow-hat-trigger

      # Bewusst nur `schedule`: dispatch-only-Werkzeuge wie LoRA-Training oder
      # Bildgenerierung sollen selten laufen. Ihre Stille als Mangel zu werten
      # waere ein Regel-5-Fehler.
      - id: geplante-workflows-laufen
        frage: Jeder Workflow mit schedule ist in der Laufhistorie aufgetaucht.
        pruefung: geplante-workflows-laufen
        netz: true

      - id: generatoren-lesen-faktenreferenz
        frage: Jeder inhaltserzeugende Agent liest die kanonische Kerntemperatur-Referenz (Regel 8c).
        pruefung: generatoren-lesen-faktenreferenz
        referenz: kerntemperatur-referenz
        # Bewusst eng gefasst: Rezepte enthalten zwangslaeufig Kerntemperaturen.
        # Bei glossary-agent und social-posts ist der Bezug schwaecher — wer sie
        # aufnehmen will, soll das hier sichtbar entscheiden, nicht im Code.
        generatoren:
          - scripts/recipe-agent.mjs

      # ACHTUNG, offene Grundsatzfrage: Regel 4 verlangt "Agenten produzieren
      # Entwuerfe, Uwe gibt frei". recipe-grow.yml und glossary-grow.yml
      # committen und pushen aber direkt auf main - laut eigener Ausgabe
      # "loest Deploy aus". Es gibt kein draft-Flag im Frontmatter und kein
      # solches Feld im Contentlayer-Schema. Entweder die Workflows oder die
      # Regel muessen sich aendern; dieses Kriterium haelt den Widerspruch
      # sichtbar, bis das entschieden ist.
      # Stand 03.10.2026: Der Absatz oben beschreibt die Messung vom 13.08.2026.
      # Seit 04.09.2026 oeffnen die Bot-Workflows Pull Requests statt direkt
      # zu pushen (docs/ci-bot-pat.md). glossary-grow.yml ist seit 03.10.2026
      # pausiert (kein Zeitplan, nur Handstart). Entfernt am 03.10.2026:
      # auto-fix.yml, newsletter-weekly.yml, ideen-radar.yml.
      - id: generatoren-pushen-nicht-direkt
        frage: Kein Workflow pusht generierte Artefakte direkt, ohne Pull Request (Regel 4).
        pruefung: generatoren-pushen-nicht-direkt

      - id: moderation-fuer-einreichungen
        frage: Nutzereinreichungen durchlaufen ein Moderations-Gate.
        pruefung: moderation-fuer-einreichungen

      - id: embedding-modell-konfigurierbar
        frage: Das Embedding-Modell ist über eine Umgebungsvariable konfigurierbar.
        pruefung: embedding-modell-konfigurierbar

      - id: ki-routen-mit-fehlerbehandlung
        frage: Jede API-Route mit KI-Aufruf fängt Fehler ab.
        pruefung: ki-routen-mit-fehlerbehandlung

      - id: kochwissen-ingest-gruen
        frage: Der Workflow "Kochwissen ingestieren" ist zuletzt erfolgreich gelaufen.
        pruefung: workflow-zuletzt-gruen
        workflow: Kochwissen ingestieren
        netz: true

  - name: Monetarisierung
    beschreibung: >-
      Verdienen die Links, was sie sollen — und ist das rechtlich sauber
      gekennzeichnet? Umsatzzahlen selbst sind hier NICHT enthalten: dafür
      wäre ein Digistore24-API-Zugang nötig, den es im Repo nicht gibt.
      Gemessen wird die Verdrahtung, nicht der Ertrag.
    kriterien:
      - id: amazon-links-mit-partner-tag
        frage: Jeder Amazon-Link trägt den Partner-Tag.
        pruefung: amazon-links-mit-partner-tag
        tag: steakakademie-21

      # Bewusst NICHT geprüft: ob Amazon-Links /dp/-Deeplinks sind. Bei
      # US-Eigenvertrieb (Thermapen, ThermoWorks) ist die Such-URL die
      # richtige Wahl gegen tote Deeplinks — memory.md, 25.06.2026.
      - id: keine-platzhalter-links
        frage: Kein Produkt verweist noch auf einen Platzhalter-Link.
        pruefung: keine-platzhalter-links

      - id: jeder-produktlink-mit-tracking
        frage: Jeder Produktlink trägt einen Tracking-Parameter, verdient also bei Klick.
        pruefung: jeder-produktlink-mit-tracking

      - id: provider-in-programmregistry
        frage: Jeder provider-Wert in registry.yaml ist in affiliate-programs.yaml hinterlegt.
        pruefung: provider-in-programmregistry

      - id: mindestens-ein-programm-aktiv
        frage: Mindestens ein Affiliate-Programm steht auf status active.
        pruefung: mindestens-ein-programm-aktiv

      # 90 Tage ist eine gesetzte Grenze, keine gemessene Wahrheit — sie steht
      # hier sichtbar und ist diskutierbar, statt im Code zu verschwinden.
      - id: produktdaten-aktuell
        frage: Kein Produkt wurde länger als 90 Tage nicht geprüft.
        pruefung: produktdaten-aktuell
        maxTage: 90

      - id: alle-produkte-mit-pruefdatum
        frage: Jedes Produkt trägt ein lastChecked-Datum.
        pruefung: alle-produkte-mit-pruefdatum

      - id: werbekennzeichnung-in-komponenten
        frage: Jede Affiliate-Komponente kennzeichnet Werbung (Regel 1).
        pruefung: werbekennzeichnung-in-komponenten

      # Bewusst NICHT geprüft: sha_sign-Signatur. Der eingesetzte Digistore-
      # IPN-Typ unterstützt sie nicht; Token-in-URL ist die dokumentierte Wahl.
      - id: webhook-weist-ohne-token-ab
        frage: Der Digistore-Webhook weist Anfragen ohne gültiges Token mit 401 ab.
        pruefung: webhook-weist-ohne-token-ab

      - id: affiliate-link-check-gruen
        frage: Der Workflow "Affiliate Link Check" ist zuletzt erfolgreich gelaufen.
        pruefung: workflow-zuletzt-gruen
        workflow: Affiliate Link Check
        netz: true

  - name: Technische Infrastruktur
    beschreibung: >-
      Betriebszustand: Erreichbarkeit, Transportsicherheit, DNS, Mailzustellung
      und Automatisierung. Fast alles davon ist NUR von außen prüfbar — ein
      grüner Repo-Stand sagt nichts über den laufenden Betrieb. Ohne Netz
      bleibt der Bereich deshalb überwiegend nicht_messbar.
    kriterien:
      - id: live-erreichbar
        frage: Die Live-Seite antwortet über HTTPS mit Status 200.
        pruefung: live-erreichbar
        netz: true

      - id: hsts-aktiv
        frage: Die Live-Seite sendet einen Strict-Transport-Security-Header.
        pruefung: header-gesetzt
        header: [strict-transport-security]
        netz: true

      - id: basis-security-header
        frage: Die Live-Seite sendet die vier Basis-Security-Header.
        pruefung: header-gesetzt
        header:
          - x-content-type-options
          - x-frame-options
          - referrer-policy
          - permissions-policy
        netz: true

      # Bewusst eigenes Kriterium statt Teil der Basis-Header: CSP ist der
      # einzige fehlende und braucht echte Arbeit (Quellen inventarisieren),
      # nicht nur eine Header-Zeile.
      - id: csp-gesetzt
        frage: Die Live-Seite sendet eine Content-Security-Policy.
        pruefung: header-gesetzt
        header: [content-security-policy]
        netz: true

      - id: dns-ueber-cloudflare
        frage: Die Nameserver der Domain liegen bei Cloudflare.
        pruefung: dns-cloudflare
        netz: true

      - id: mail-empfang-konfiguriert
        frage: Die Domain hat MX-Einträge und kann Mail empfangen.
        pruefung: mail-empfang
        netz: true

      - id: spf-vorhanden
        frage: Die Domain veröffentlicht einen SPF-Record.
        pruefung: spf-vorhanden
        netz: true

      - id: dmarc-erzwingend
