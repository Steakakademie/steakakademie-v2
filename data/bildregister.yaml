# Bildregister — Nachweis der Nutzungsrechte
#
# WARUM ES DAS GIBT
# Im Streitfall liegt die Beweislast fuer die Lizenz bei uns, nicht beim
# Abmahnenden. Die Erinnerung "war doch von Unsplash" ist kein Nachweis:
# Lizenzbedingungen aendern sich, und es gilt die Fassung zum Zeitpunkt des
# Downloads. Deshalb wird hier JEDES Bild unter public/ mit Herkunft gefuehrt.
#
# HARTE REGEL
# scripts/legal-guard.mjs bricht den Build ab, sobald ein Bild unter public/
# keinen Eintrag hier hat. Neues Bild = neuer Eintrag, ohne Ausnahme.
#
# STATUS-WERTE
#   eigen     Eigene Aufnahme oder eigene Grafik. Unbedenklich.
#   ki        KI-erzeugt. Kommerzielle Nutzung haengt am Anbieter-Tarif —
#             bei Adobe Firefly den eigenen Plan pruefen. Ausserdem pruefen,
#             ob das Modell ungewollt Marken oder Gesichter reproduziert hat.
#   lizenz    Fremdbild mit dokumentierter Lizenz. Dann sind quelle, lizenz,
#             lizenz_url und erworben_am Pflicht.
#   offen     Herkunft noch nicht geklaert. ARBEITSVORRAT — der Guard meldet
#             die Anzahl, bricht aber nicht ab. Ziel ist null.
#
# WORAUF ES ANKOMMT (unabhaengig von der Quelle)
#   - Erkennbare Personen brauchen eine Einwilligung (Paragraph 22 KUG),
#     auch auf "freien" Fotos. Unsplash und Pexels liefern KEIN Model-Release.
#   - Sichtbare Marken und Logos auf Grills, Messern, Verpackungen sind
#     Markenrecht. Bei BBQ-Motiven ist der Herstellerkessel schnell im Bild.
#   - namensnennung: true bedeutet, die Nennung MUSS am Bild erscheinen
#     (CC BY, CC BY-SA). In einer E-Mail ist das unpraktisch — solche Bilder
#     dort besser meiden.
#
# Angelegt im Rechts-Audit vom 2026-08-30.

