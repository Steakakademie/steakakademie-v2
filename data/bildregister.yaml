      und Gittermuster ("Carpaccio oder Roastbeef"). FLUX.1 dev hat offenbar kein
      belastbares Konzept von aufgeschnittener Zunge und liefert verlaesslich
      Muskelfleischscheiben. Weiteres Nachsteuern am Prompt ist aussichtslos —
      BRAUCHT EIN ECHTFOTO. Der verschaerfte imagePrompt in der MDX bleibt stehen,
      damit ein spaeterer Versuch nicht bei null anfaengt.
