faq:
  - frage: "Was schenke ich jemandem, der schon ein Thermometer hat?"
    antwort: "Ein Tranchiermesser oder ein Sous-vide-Stab verändern mehr als ein zweites Thermometer. Wer beides hat, freut sich über eine neue Technik — Oberhitze oder ein Keramikgrill — oder über einen Gutschein, mit dem die beschenkte Person selbst wählt."
  - frage: "Sind das Sets, die ich zusammen kaufen kann?"
    antwort: "Nein. Jede Zusammenstellung ist eine Empfehlung; jedes Teil führt in seinen eigenen Shop, es gibt keinen Paketpreis. Welche Teile zusammen sinnvoll sind, steht bei jedem Produkt."
  - frage: "Warum stehen hier keine Preise?"
    antwort: "Preise ändern sich gerade in der Geschenksaison täglich. Den aktuellen Preis und die Verfügbarkeit siehst du beim Anbieter; wir nennen lieber keinen Preis als einen falschen."
  - frage: "Warum gibt es keine Testurteile?"
    antwort: "Unsere Empfehlungen beruhen auf Herstellerangaben, öffentlich zugänglichen Daten und unserer Grillpraxis, nicht auf eigenen Gerätetests. Deshalb begründen wir jede Empfehlung, statt Sterne zu vergeben."
