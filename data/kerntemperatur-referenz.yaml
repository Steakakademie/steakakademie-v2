# ════════════════════════════════════════════════════════════════════════════
# Kanonische Kerntemperatur-Referenz — Single Source of Truth
# Quelle: Steakakademie_Kerntemperatur-Referenz.md (Uwe Yendell)
#
# Alle Werte = KERNTEMPERATUR im dicksten Punkt, gemessen VOR dem Ruhen.
# Genauigkeit ist der Burggraben (CLAUDE.md 8c) — diese Werte sind autoritativ
# und überschreiben aus Rezept-Text gescrapte Einzelwerte.
#
# Nutzung: Promo-Maschine (Fakt-Badge), Rezept-Briefs, Temperatur-Guide.
# ════════════════════════════════════════════════════════════════════════════

meta:
  carryover: "Nachziehen +2–5 °C — ca. 3 °C vor Ziel vom Grill nehmen"
  ruhen: "Steaks 5–7 Min., große Braten 10–20 Min. — auf vorgewärmter Unterlage (Stein oder Brett, rund 85 °C), nie auf dem kalten Teller (Uwe, 20.09.2026)"
  messen: "Einstich in den dicksten Punkt, NICHT am Knochen"
  ziehtemperatur: "Bei Reverse Sear liegt die ZIEHtemperatur unter dem Badge-Wert. Kurzes, sehr heisses Searing hebt den Kern noch einmal um 2-3 °C (Uwe, 27.08.2026); dazu kommt das Nachziehen. Medium Rare: bei 50-51 °C ziehen, serviert 52-55 °C (Steakakademie-Standard: 54 °C, oberer Rand). Ein Ziehwert unterhalb des Badges ist deshalb KEIN Widerspruch zu dieser Referenz."
  spannen: "Die range-Werte sind Korridore, keine Punktwerte — sie decken die Garbereiche von Rare bis Well Done ab. Der c-Wert ist die Anzeige-Empfehlung innerhalb des Korridors."

# Garstufen-Skala Rind (bestaetigt, Uwe 07.09.2026 — abgeglichen mit externer
# Referenztabelle). Ersetzt die vorherige, nie formal bestaetigte Skala
# (rare 50-54/medium 58-63/well_done 68+). beef_mr unten folgt dieser Skala:
# 54 °C bleibt der Steakakademie-Standard, jetzt am oberen statt am unteren
# Rand des MR-Korridors.
garstufen_rind:
  bestaetigt: true
  rare:        { range: [45, 49], label: "Rare" }
  medium_rare: { range: [52, 55], label: "Medium Rare" }   # Standard 54 °C, siehe badges.beef_mr
  medium:      { range: [55, 60], label: "Medium" }
  medium_well: { range: [60, 65], label: "Medium Well" }
  well_done:   { range: [70, 99], label: "Well Done" }

# Badge-Werte für Promos/Content. `c` = empfohlene Serviertemperatur (ein Wert
# für die Anzeige), `range` = Korridor, `label` = Garstufe/Hinweis.
badges:
  beef_mr:      { c: 54, range: [52, 55], label: "Medium Rare" }      # Premium-Steaks (Steakakademie-Empfehlung, oberer Rand des MR-Korridors)
  beef_lowslow: { c: 93, range: [90, 96], label: "Low & Slow" }       # Brisket/Short Ribs — Kollagen → Gelatine
  wagyu:        { c: 52, range: [50, 54], label: "Medium Rare" }      # Fett schmilzt früh
  lamb_mr:      { c: 56, range: [54, 57], label: "Medium Rare" }
  lamb_done:    { c: 70, range: [70, 75], label: "durch" }            # Keule durch
  lamb_rosa:    { c: 62, range: [60, 65], label: "rosa" }             # Keule rosa (Uwe, 15.09.2026) — zwischen lamb_mr und lamb_done; Rezepte lammkeule-drehspiess, aussie-lamb-leg-butterflied (#109)
  pork_juicy:   { c: 63, range: [63, 65], label: "saftig" }           # Untergrenze = sicherheit.schwein (63); vorher [60,65] und damit im Widerspruch zur eigenen Sicherheitsangabe — Audit 06.09.2026
  # Ibérico (Pluma/Presa/Secreto) eigener Korridor (Uwe, 23.09.2026, Kurspraxis):
  # 65–68 statt pork_juicy 63–65. Ziehwert 63–64, zieht in der Ruhe nach. Grund:
  # das intramuskuläre Fett ist erst darüber vollständig geschmolzen, und deutsche
  # Gäste nehmen Schwein bei 63–65 nicht an. Untergrenze bleibt >= sicherheit.schwein.
  iberico:      { c: 66, range: [65, 68], label: "durch, saftig" }
  pork_lowslow: { c: 92, range: [88, 95], label: "zupfbar" }          # Pulled Pork / Spareribs
  pork_kruste:  { c: 72, range: [70, 75], label: "durch" }            # Krustenbraten
  poultry:      { c: 74, range: [72, 80], label: "durchgegart" }      # Hähnchen/Pute — IMMER durch (≥72 °C); Keule/Flügel 74–80
  # Brust getrennt (Uwe, 23.09.2026, Kurspraxis): bei 68 °C vom Grill, zieht in der
  # Ruhe auf 72 nach — darüber trocken. Der Endwert bleibt >= sicherheit.gefluegel;
  # 68 ist ausdrücklich ZIEHwert, kein Serviertwert (im Text so formulieren).
  poultry_breast: { c: 72, range: [72, 74], label: "durch, saftig" }
  duck_breast:  { c: 58, range: [56, 62], label: "rosa" }             # Sonderfall: Entenbrust darf rosa
  duck_whole:   { c: 75, range: [70, 80], label: "knusprig durch" }   # ganze Ente/Gans
  salmon:       { c: 52, range: [48, 52], label: "glasig" }
  tuna:         { c: 46, range: [40, 46], label: "seared" }
  whitefish:    { c: 58, range: [55, 62], label: "durch" }            # Dorade/Kabeljau/Rotbarbe/Mahi/Schwertfisch
  oily_whole:   { c: 63, range: [60, 65], label: "durch" }            # ganze Makrele/Sardine
  burger:       { c: 70, range: [70, 72], label: "durchgegart" }      # Hack: durch Wolfen Keime innen → ≥70 °C

# Sicherheits-Mindestwerte (nie unterschreiten — Risikogruppen)
sicherheit:
  schwein: 63          # Lebensmittelhygiene
  gefluegel: 72        # Salmonellen
  hackfleisch: 70      # gewolft
  wildschwein: 70      # Trichinen — immer durch
