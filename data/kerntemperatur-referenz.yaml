# ════════════════════════════════════════════════════════════════════════════
# Kanonische Kerntemperatur-Referenz — Single Source of Truth
# Quelle: Steakakademie_Kerntemperatur-Referenz.md (Uwe Yendell)
#
# Alle Werte = KERNTEMPERATUR im dicksten Punkt, gemessen VOR dem Ruhen.
# Genauigkeit ist der Burggraben (CLAUDE.md 8c) — diese Werte sind autoritativ
# und überschreiben aus Rezept-Text gescrapte Einzelwerte.
#
# Nutzung: Promo-Maschine (Fakt-Badge), Rezept-Briefs, Temperatur-Guide.
# ════════════════════════════════════════════════════════════════════════════

meta:
  carryover: "Nachziehen +2–5 °C — ca. 3 °C vor Ziel vom Grill nehmen"
  # Unterlage getrennt (Uwe, 30.09.2026): Stein 75 °C, weil er die Hitze laenger haelt und staerker weitergibt; Holzbrett 85 °C.
  ruhen: "Steaks 5–7 Min., große Braten 10–20 Min. — auf vorgewärmter Unterlage (Holzbrett rund 85 °C, Stein rund 75 °C), nie auf dem kalten Teller (Uwe, 30.09.2026)"
  messen: "Einstich in den dicksten Punkt, NICHT am Knochen"
  ziehtemperatur: "Bei Reverse Sear liegt die ZIEHtemperatur unter dem Badge-Wert. Kurzes, sehr heisses Searing hebt den Kern noch einmal um 2-3 °C (Uwe, 27.08.2026); dazu kommt das Nachziehen. Medium Rare: bei 50-51 °C ziehen, serviert 48-54 °C (Steakakademie-Standard: 54 °C, oberer Rand). Ein Ziehwert unterhalb des Badges ist deshalb KEIN Widerspruch zu dieser Referenz."
  spannen: "Die range-Werte sind Korridore, keine Punktwerte — sie decken die Garbereiche von Rare bis Well Done ab. Der c-Wert ist die Anzeige-Empfehlung innerhalb des Korridors."

# Garstufen-Skala Rind — VERBINDLICH seit 19.10.2026 (Uwe, im Chat: „gleiche wirklich
# ALLES an diese hier geposteten an, so dass es dazu nie mehr Diskussionen geben kann").
# Ersetzt die Skala vom 07.09.2026 (rare 45-49 / MR 52-55 / medium 55-60 / medium_well
# 60-65 / well_done 70+). Die Stufe Medium Well gibt es seitdem NICHT mehr: ab 60 °C ist
# ein Rindersteak Well Done. 54 °C bleibt Steakakademie-Standard (oberer Rand Medium Rare).
# Wächter: src/__tests__/kerntemperatur-steak-tabelle.test.ts
garstufen_rind:
  bestaetigt: true
  rare:        { range: [44, 47], label: "Rare" }
  medium_rare: { range: [48, 54], label: "Medium Rare" }   # Standard 54 °C, siehe badges.beef_mr
  medium:      { range: [55, 59], label: "Medium" }
  well_done:   { range: [60, 99], label: "Well Done" }        # „60 °C" = ab 60 °C

# Steak-Tabelle nach Teilstück — VERBINDLICH seit 19.10.2026 (Uwe, Tabelle im Chat).
# Werte 1:1 übernommen; Uwes Grafik 19.10.2026 bestätigt die Spalten: Well done = „ab X °C" (range [X, 99]). Spalten-Zuordnung bei Zeilen mit weniger als vier Werten
# (Claude, offengelegt): 3 Werte = medium_rare/medium/well_done, 2 Werte = medium/well_done.
# Nackensteak steht in Uwes Tabelle und Grafik im Rindblock → Rinder-Nackensteak.
# Schweinenacken bleibt bei badges.pork_nacken.
# Werte unter dem Sicherheitsminimum (Schwein 63, Wildschwein 70) zeigen die Seiten
# nur mit dem Pflichthinweis des zugehörigen Badges (pork_steak_rosa, boar_steak*).
steak_tabelle:
  - { cut: "Rindersteak",          tier: rind,  rare: [44, 47], medium_rare: [48, 54], medium: [55, 59], well_done: [60, 99] }
  - { cut: "Rumpsteak",            tier: rind,  rare: [44, 47], medium_rare: [48, 54], medium: [55, 59], well_done: [60, 99] }
  - { cut: "Entrecote",            tier: rind,  rare: [44, 47], medium_rare: [48, 54], medium: [55, 59], well_done: [60, 99] }
  - { cut: "Rib Eye Steak",        tier: rind,  rare: [44, 47], medium_rare: [48, 54], medium: [55, 59], well_done: [60, 99] }
  - { cut: "Tomahawk Steak",       tier: rind,  rare: [44, 47], medium_rare: [48, 54], medium: [55, 59], well_done: [60, 99] }
  - { cut: "Rinderkotelett",       tier: rind,  rare: [44, 47], medium_rare: [48, 54], medium: [55, 59], well_done: [60, 99] }
  - { cut: "T-Bone Steak",         tier: rind,  rare: [44, 47], medium_rare: [48, 54], medium: [55, 59], well_done: [60, 99] }
  - { cut: "Porterhouse Steak",    tier: rind,  rare: [44, 47], medium_rare: [48, 54], medium: [55, 59], well_done: [60, 99] }
  - { cut: "Nackensteak",          tier: rind,  rare: [44, 47], medium_rare: [48, 54], medium: [56, 59], well_done: [60, 99] }
  - { cut: "Flat Iron Steak",      tier: rind,  rare: [44, 47], medium_rare: [48, 55], medium: [56, 59], well_done: [60, 99] }
  - { cut: "Hüftsteak",            tier: rind,  rare: [44, 47], medium_rare: [48, 55], medium: [56, 59], well_done: [60, 99] }
  - { cut: "Spider Steak",         tier: rind,  rare: [44, 47], medium_rare: [48, 55], medium: [56, 59], well_done: [60, 99] }
  - { cut: "Flank Steak",          tier: rind,  rare: [44, 47], medium_rare: [48, 55], medium: [56, 59], well_done: [60, 99] }
  - { cut: "Kalbssteak",           tier: kalb,  medium: [55, 57], well_done: [60, 99] }
  - { cut: "Kalbskotelett",        tier: kalb,  medium: [55, 57], well_done: [60, 99] }
  - { cut: "Schweinesteak",        tier: schwein, medium: [58, 62], well_done: [65, 99], badge: pork_steak_rosa }
  - { cut: "Schweinekotelett",     tier: schwein, medium: [58, 62], well_done: [65, 99], badge: pork_steak_rosa }
  - { cut: "Lammsteak",            tier: lamm,  medium_rare: [58, 60], medium: [61, 64], well_done: [65, 99] }
  - { cut: "Lammkotelett",         tier: lamm,  medium_rare: [58, 60], medium: [61, 64], well_done: [65, 99] }
  - { cut: "Rehsteak",             tier: wild,  medium: [55, 59], well_done: [60, 99] }
  - { cut: "Hirschsteak",          tier: wild,  medium: [60, 64], well_done: [65, 99] }
