# Bewusste Ausnahmen — KEIN Widerspruch zur steak_tabelle (Uwe, 19.10.2026, bestätigt):
#   - Rinderhüfte am Stück (rinderhuefte-gasgrill-smoke): 60–61 °C „zartrosa" — ganzer Braten, kein Steak.
#   - Schweinefilet Sous-Vide (Temperatur-Guide): 60 °C im Wasserbad — danach auf den Grill für Röstaromen.
#   - Reh- und Hirschkeule (Temperatur-Guide): eigene Werte — Keule, kein Steak.
# Audits und Agenten melden diese Stellen NICHT als Abweichung.

# Badge-Werte für Promos/Content. `c` = empfohlene Serviertemperatur (ein Wert
# für die Anzeige), `range` = Korridor, `label` = Garstufe/Hinweis.
badges:
  beef_mr:      { c: 54, range: [48, 54], label: "Medium Rare" }      # Premium-Steaks (Steakakademie-Empfehlung, oberer Rand des MR-Korridors)
  beef_lowslow: { c: 93, range: [90, 96], label: "Low & Slow" }       # Brisket/Short Ribs — Kollagen → Gelatine
  wagyu:        { c: 52, range: [50, 54], label: "Medium Rare" }      # Fett schmilzt früh
  # Flank Steak (Teilstück-Eintrag, 05.10.2026): Werte = beef_mr und = Angabe im
  # veröffentlichten Rezept flank-steak-grillen (52–55 °C). Von Uwe bestätigt
  # (05.10.2026). Herkunft bleibt: abgeleitet, KEINE eigene Messreihe für dieses
  # Teilstück.
  beef_flank:   { c: 54, range: [48, 55], label: "Medium Rare" }   # 19.10.2026: = steak_tabelle Flank Steak
  lamb_mr:      { c: 59, range: [58, 60], label: "Medium Rare" }      # Lammsteak/-kotelett/-karree — 19.10.2026 = steak_tabelle (vorher 54-57)
  lamb_steak_medium: { c: 62, range: [61, 64], label: "Medium" }     # 19.10.2026, steak_tabelle Lammsteak/-kotelett
  lamb_steak_done:   { c: 65, range: [65, 99], label: "Well Done (durch)" }
  # Kalb und Wild (Steaks) — 19.10.2026, steak_tabelle
  veal_steak:      { c: 56, range: [55, 57], label: "Medium (rosa)" }
  veal_steak_done: { c: 60, range: [60, 99], label: "Well Done (durch)" }
  reh_steak:       { c: 57, range: [55, 59], label: "Medium (rosa)" }
  reh_steak_done:  { c: 60, range: [60, 99], label: "Well Done (durch)" }
  hirsch_steak:      { c: 62, range: [60, 64], label: "Medium (rosa)" }
  hirsch_steak_done: { c: 65, range: [65, 99], label: "Well Done (durch)" }
  lamb_done:    { c: 70, range: [70, 75], label: "durch" }            # Keule durch
  lamb_rosa:    { c: 62, range: [60, 65], label: "rosa" }             # Keule rosa (Uwe, 15.09.2026) — zwischen lamb_mr und lamb_done; Rezepte lammkeule-drehspiess, aussie-lamb-leg-butterflied (#109)
  pork_juicy:   { c: 63, range: [63, 65], label: "saftig" }           # Untergrenze = sicherheit.schwein (63); vorher [60,65] und damit im Widerspruch zur eigenen Sicherheitsangabe — Audit 06.09.2026
  # Ibérico (Pluma/Presa/Secreto) eigener Korridor (Uwe, 23.09.2026, Kurspraxis):
  # 65–68 statt pork_juicy 63–65. Ziehwert 63–64, zieht in der Ruhe nach. Grund:
  # das intramuskuläre Fett ist erst darüber vollständig geschmolzen, und deutsche
  # Gäste nehmen Schwein bei 63–65 nicht an. Untergrenze bleibt >= sicherheit.schwein.
  iberico:      { c: 66, range: [65, 68], label: "durch, saftig" }
  # Schweinesteak/-kotelett (Uwe, 19.10.2026, steak_tabelle): 58-62 rosa, 65 durch.
  # Rosa liegt UNTER sicherheit.schwein (63) → unter_sicherheit + Pflicht-hinweis.
  # Automatisch erzeugte Texte (Rezept-Agent) nehmen pork_steak_durch.
  pork_steak_rosa:  { c: 60, range: [58, 62], label: "Medium (rosa)", unter_sicherheit: true, hinweis: "Rosa gegartes Schwein liegt unter dem empfohlenen Mindestwert von 63 °C. Für Schwangere, Kinder, ältere und immungeschwächte Menschen immer durchgaren (mindestens 65 °C)." }
  pork_steak_durch: { c: 65, range: [65, 99], label: "Well Done (durch)" }
  pork_lowslow: { c: 92, range: [90, 95], label: "zupfbar" }          # Pulled Pork / Spareribs
  pork_kruste:  { c: 72, range: [70, 75], label: "durch" }            # Krustenbraten — Teilstück bis 29.09.2026 nie benannt; passt zu Keule/Schulter, NICHT zu Bauch
  # Schwein nach Teilstück (Uwe, 29.09.2026): „Es gibt nicht die eine Wahrheit bei
  # den Kerntemperaturen, weil immer auch das Teilstück eine Rolle spielt."
  # Richtwerte, alle über sicherheit.schwein (63). Keule/Schulter = Uwes „ca."-Wert
  # als Punktwert (kein erfundener Korridor). Bauch 80–85 = bisheriger Guide-Wert.
  pork_keule:    { c: 70, range: [70, 70], label: "saftig" }          # mager, trocknet schnell — exakt messen
  pork_schulter: { c: 75, range: [75, 75], label: "saftig, klassisch" }
  pork_bauch:    { c: 80, range: [80, 85], label: "zart" }            # Fett und Bindegewebe schmelzen erst lange; Krustenbraten vom Bauch
  # Schweinenacken (Uwe, 08.10.2026, im Chat): 75 °C durch, 70 °C leicht rosa, verzeiht
  # dank Fett bis 80 °C. Pulled Pork vom Nacken bleibt bei pork_lowslow (90–95).
  pork_nacken:      { c: 75, range: [75, 80], label: "durch, verzeiht bis 80" }
  pork_nacken_rosa: { c: 70, range: [70, 70], label: "leicht rosa" }
  poultry:      { c: 74, range: [72, 80], label: "durchgegart" }      # Hähnchen/Pute — IMMER durch (≥72 °C); Keule/Flügel 74–80
  # Brust getrennt (Uwe, 23.09.2026, Kurspraxis): bei 68 °C vom Grill, zieht in der
  # Ruhe auf 72 nach — darüber trocken. Der Endwert bleibt >= sicherheit.gefluegel;
  # 68 ist ausdrücklich ZIEHwert, kein Serviertwert (im Text so formulieren).
  poultry_breast: { c: 72, range: [72, 74], label: "durch, saftig" }
  duck_breast:  { c: 58, range: [56, 62], label: "rosa", unter_sicherheit: true, hinweis: "Entenbrust ist der Sonderfall unter den Geflügelstücken: rosa gegart, am Stück, nie zerkleinert." }  # Sonderfall seit jeher; Flag 29.09.2026 explizit gemacht
  duck_whole:   { c: 75, range: [72, 80], label: "knusprig durch" }   # ganze Ente — Untergrenze 29.09.2026 von 70 auf sicherheit.gefluegel (72) angehoben; vorher unter der eigenen Sicherheitsgrenze
  # Gans nach Teilstück (Uwe, 29.09.2026). Korridore = Uwes Werte, c = Mitte.
  # Alle Werte über sicherheit.gefluegel.
  goose_whole:      { c: 77, range: [75, 79], label: "rosa / saftig" }
  goose_whole_done: { c: 82, range: [80, 85], label: "durchgebraten, zart" }
  goose_breast:     { c: 75, range: [73, 78], label: "rosa" }          # Farbe kommt vom dunklen Muskelfleisch — der Wert liegt über sicherheit.gefluegel
  goose_breast_done: { c: 80, range: [79, 82], label: "durchgebraten" }
  goose_leg:        { c: 82, range: [80, 85], label: "löst sich vom Knochen" }
  salmon:       { c: 52, range: [48, 52], label: "glasig" }
  tuna:         { c: 46, range: [40, 46], label: "seared" }
  whitefish:    { c: 58, range: [55, 62], label: "durch" }            # Dorade/Kabeljau/Rotbarbe/Mahi/Schwertfisch
  oily_whole:   { c: 63, range: [60, 65], label: "durch" }            # ganze Makrele/Sardine
  burger:       { c: 70, range: [70, 72], label: "durchgegart" }      # Hack: durch Wolfen Keime innen → ≥70 °C
  # Leber rosa (Uwe, 16.10.2026): „In Deutschland die Kerntemperatur für Leber auf
  # 58–60 °C setzen." Innerei, rosa gegart — unter_sicherheit + Pflicht-hinweis für
  # Risikogruppen. Automatisch erzeugte Texte (Rezept-Agent) garen höher durch.
  liver:        { c: 59, range: [58, 60], label: "rosa", unter_sicherheit: true, hinweis: "Rosa gegart. Leber kann Campylobacter tragen — für Schwangere, Kinder, ältere und immungeschwächte Menschen immer auf mindestens 70 °C durchgaren." }
  # Wildschwein nach Teilstück (Uwe, 29.09.2026, zweimal bestätigt: „sollte auf
  # Dauer innerhalb des Systems integriert werden"). Rücken und Filet rosa liegen
  # UNTER sicherheit.wildschwein — deshalb unter_sicherheit + Pflicht-hinweis.
  # Claudes Einwand (Hepatitis E, EFSA) ist im PR #246 dokumentiert. Automatisch
  # erzeugte Texte (Rezept-Agent, Content-Gate) bleiben bei sicherheit.wildschwein.
  boar_ruecken: { c: 63, range: [60, 66], label: "leicht rosa", unter_sicherheit: true, hinweis: "Rosa nur bei amtlich auf Trichinen untersuchtem Fleisch. Wildschwein kann Hepatitis-E-Viren tragen — für Schwangere, Kinder, ältere und immungeschwächte Menschen immer auf mindestens 70 °C durchgaren." }
  boar_filet:   { c: 62, range: [60, 64], label: "zartrosa", unter_sicherheit: true, hinweis: "Rosa nur bei amtlich auf Trichinen untersuchtem Fleisch. Wildschwein kann Hepatitis-E-Viren tragen — für Schwangere, Kinder, ältere und immungeschwächte Menschen immer auf mindestens 70 °C durchgaren." }
  # Wildschweinsteak (Uwe, 19.10.2026, steak_tabelle): 64-66 rosa, 67 durch — beides
  # unter sicherheit.wildschwein (70) → unter_sicherheit + Pflicht-hinweis.
  boar_steak:      { c: 65, range: [64, 66], label: "Medium (rosa)", unter_sicherheit: true, hinweis: "Rosa nur bei amtlich auf Trichinen untersuchtem Fleisch. Wildschwein kann Hepatitis-E-Viren tragen — für Schwangere, Kinder, ältere und immungeschwächte Menschen immer auf mindestens 70 °C durchgaren." }
  boar_steak_done: { c: 67, range: [67, 99], label: "Well Done (durch)", unter_sicherheit: true, hinweis: "67 °C liegt unter dem Sicherheitswert für Wildschwein (70 °C). Für Schwangere, Kinder, ältere und immungeschwächte Menschen immer auf mindestens 70 °C durchgaren." }
  boar_braten:  { c: 78, range: [75, 80], label: "voll gar, saftig" }  # Braten, Nacken — Low & Slow
  boar_keule:   { c: 78, range: [75, 82], label: "durchgegart, weich" } # Keule, Schulter — Schmoren, Smoken

# Sicherheits-Mindestwerte (nie unterschreiten — Risikogruppen)
sicherheit:
  schwein: 63          # Lebensmittelhygiene
  gefluegel: 72        # Salmonellen
  hackfleisch: 70      # gewolft
  wildschwein: 70      # Trichinen/Hepatitis E — Standard und Pflicht für Risikogruppen; Ausnahmen nur über unter_sicherheit (boar_ruecken, boar_filet)
