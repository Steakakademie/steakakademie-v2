# ══════════════════════════════════════════════════════════════════════════════
# Zusagen-Register — was die Seite verspricht und woran jedes Versprechen hängt.
#
# Konzept: claude.ai-Projekt „Steakakademie", konzept_waechter_2026-10-02
# (Freigabe Uwe). Abteilung: Systems & Ops. Anleitung: docs/waechter.md.
#
# Wozu: Die Erstinventur vom 03.10.2026 fand Sätze wie „jeden Freitag" ohne eine
# einzige versendete Kampagne. Ein Wächter kann nur prüfen, was er kennt — hier
# steht es. EIN EINTRAG JE VERSPRECHEN, das von etwas außerhalb des Satzes abhängt.
#
# Gelesen von scripts/lib/zusagen.mjs:
#   · Gate (npm run check:zusagen, Pflicht-Check): Form, Fundstellen, Belege ohne
#     Netz — und kein Zusage-Muster im Seitentext ohne Eintrag.
#   · Tägliche Belegprüfung (ops-heartbeat): JEDER Beleg, auch die mit Netz.
#
# FELDER
#   id         kebab-case, eindeutig.
#   zusage     Ein Satz in eigenen Worten: was versprochen wird.
#   wo         Fundstellen. `datei` + `muster` — das Textstück, das dort steht. Wird
#              der Satz geändert, schlägt das Gate an: muster nachziehen UND prüfen,
#              ob der Beleg die neue Fassung noch deckt.
#   beleg      Woran die Zusage hängt. Ein Beleg oder eine Liste (alle müssen halten).
#                code      datei [+ regex]                        ohne Netz
#                zaehlung  zahl + quelle (glob | datei + regex)   ohne Netz
#                http      url [+ status, enthaelt, …]            täglich
#                loops     art (workflow|transactional) + id      täglich
#                supabase  tabelle + min_zeilen | max_alter_tage  täglich
#                mensch    was + geprueft_am + gueltig_tage       läuft ab
#   bei_bruch  Was zu tun ist, wenn der Beleg nicht mehr hält.
#   abteilung  Systems & Ops · Studio · Redaktion · Wachstum · Kanzlei
#   seit       Tag der Aufnahme ins Register.
#
# NICHT HIER: Preise und Verkaufstermine — die stehen in data/angebote.yaml.
#
# `mensch`-Belege vom 03.10.2026 stammen aus der Erstinventur (Namen der
# Variablen im Hosting, keine Werte). Sie laufen nach 90 Tagen ab und müssen dann
# neu nachgesehen werden.
# ══════════════════════════════════════════════════════════════════════════════

