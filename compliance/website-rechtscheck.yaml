  # ── NEU 10.08.2026: UWG-Novelle (EmpCo-Umsetzung), in Kraft 27.09.2026 ───────
  - id: green-claims-empco
    titel: "Umweltbezogene Werbeaussagen & Nachhaltigkeitssiegel (EmpCo/UWG-Novelle)"
    herkunft: agent-bestand
    neu: true
    pruefung: >-
      Keine allgemeinen Umweltaussagen ohne belastbaren Nachweis ('nachhaltig', 'umweltfreundlich',
      'klimaneutral', 'öko', 'grün'); keine Kompensations-Claims allein auf Basis von CO2-Zertifikaten;
      Nachhaltigkeitssiegel nur, wenn auf zertifiziertem System beruhend oder behördlich eingeführt.
      Gilt auch für Affiliate-Produkttexte und redaktionelle Produktempfehlungen.
    rechtsgrundlage: >-
      §§ 2, 5, 5b UWG + Anhang zu § 3 Abs. 3 UWG i.d.F. des Dritten Gesetzes zur Änderung des UWG
      (BGBl. v. 19.02.2026), in Kraft 27.09.2026; RL (EU) 2024/825 (EmpCo);
      BGH-Rspr. zu 'klimaneutral' (Aufklärungspflicht Reduktion vs. Kompensation)
    status: monitor
    befund: >-
      Erstbewertung 10.08.2026 (Code-/Content-Scan): Exposition derzeit GERING. Keine eigenen
      Klima-/Kompensations-Claims gefunden. Zwei zu beobachtende Stellen —
      (a) src/lib/bbq-news.ts 'nachhaltigkeit-holzkohle' / Kategorie 'Nachhaltigkeit' (FSC-Siegel):
      redaktionelle Aufklärung, zulässig, solange kein pauschales Eigen-Umweltversprechen und kein
      Affiliate-Produkt als 'nachhaltig' beworben wird;
      (b) src/app/seo-sprint/page.tsx 'sauber und nachhaltig' — hier im Sinne von 'dauerhaft',
      kein Umweltclaim, aber missverständlich → Formulierung entschärfen (z. B. 'dauerhaft tragfähig').
    monitor: >-
      Frist 27.09.2026. VOR diesem Datum prüfen, sobald: Fleisch-/Herkunfts-Content mit
      Nachhaltigkeitsbezug wächst, Affiliate-Sortiment um 'nachhaltige' Produkte erweitert wird,
      oder Siegel/Logos (FSC, Bio, Tierwohl) auf eigenen Seiten abgebildet werden.
      Verstoß-Risiko: Abmahnung + Bußgeld bis 4 % Jahresumsatz.

  # ── NEU 10.08.2026: KI-Kennzeichnung am Inhalt (nicht nur zentral) ──────────
  - id: ki-kennzeichnung-am-inhalt
    titel: "KI-Kennzeichnung direkt am Inhalt (Bilder/Texte)"
    herkunft: agent-bestand
    neu: true
    pruefung: >-
      KI-generierte Rezept-/Hero-Bilder werden AM Inhalt als solche erkennbar gemacht
      (Alt-Text und/oder sichtbarer Hinweis 'KI-generiertes Symbolbild'), nicht nur zentral
      auf /ki-disclaimer. KI-Redaktionspersonas sind als KI erkennbar und tragen kein
      schema.org/Person-Markup.
    rechtsgrundlage: "§ 5 UWG (Irreführung über wesentliche Merkmale); EU AI Act Art. 50 Abs. 4; Art. 50 Abs. 2 (Provider-Pflicht, Altsysteme ab 02.12.2026)"
    status: ok
    befund: >-
      Aktualisiert 17.08.2026 (war fix-needed). ERFÜLLT bei Community-Rezepten
      (/rezepte/community/[slug]: Alt-Text '— KI-generiertes Symbolbild' + sichtbarer Hinweis im
      Fließtext) und bei den Avatar-Personas (/autoren/[slug]: Label 'KI-Redaktionspersona' + Satz
      'ist eine KI-gestützte Redaktionspersona' + Link /ki-disclaimer; schema.org/Person nur für
      reale Autoren — sauber gelöst).
      LÜCKE GESCHLOSSEN 17.08.2026: src/components/RecipeTemplate.tsx (Hero aller redaktionellen
      Rezeptseiten /rezepte/[kategorie]/[recipe]) trägt jetzt Alt-Text-Suffix
      '— KI-generiertes Symbolbild' + sichtbaren Badge 'KI-Symbolbild' (Sparkles, unten rechts),
      identische Lösung wie bei Community-Rezepten. Typecheck grün (tsc --noEmit, Exit 0).
      NICHT committet — Uwe committet via Claude Code.
    monitor: >-
      RESTLÜCKE (geringeres Risiko, offen): Listen-/Karten-Thumbnails tragen den Hinweis noch nicht —
      src/app/rezepte/page.tsx:140, src/app/rezepte/[slug]/page.tsx:507, src/app/kategorie/[slug]/page.tsx:150,
      src/app/page.tsx (Homepage-Karten), sowie /cuts/[slug]:194 und /methoden/[slug]:135.
      Auf Detailseiten ist der Hinweis gesetzt; Thumbnails sind der schwächere Irreführungsfall,
      sollten aber bei Gelegenheit nachgezogen werden (Alt-Suffix genügt).
      ANWALTSTHEMA (unverändert offen): Ob ein KI-Foodbild ein 'Deep Fake' i. S. v. Art. 3 Nr. 60
      AI Act ist, ist nicht entschieden — Art. 50 Abs. 4 greift dann nicht zwingend. Belastbarer
      Hebel bleibt § 5 UWG (Irreführung über wesentliche Merkmale). Ebenfalls Anwaltsthema:
      Avatar-Personas Marco/Jonas/Elena als Autoren — derzeit sauber als KI gelabelt, aber die
      Frage, ob eine erfundene Persona mit Fachautorität per se irreführend ist (§ 5 UWG,
      E-E-A-T-Kontext), ist nicht abschließend geklärt.

