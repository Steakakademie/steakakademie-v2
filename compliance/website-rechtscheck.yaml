    rechtsgrundlage: >-
      PAngV §§ 3, 4 (PAngV 2022, zuletzt geändert durch Art. 8 des Gesetzes vom 12.05.2026,
      BGBl. 2026 I Nr. 139 — Umsetzung RL (EU) 2023/2225 über Verbraucherkreditverträge);
      § 19 UStG (Kleinunternehmer, Grenzen 25.000 €/100.000 € seit 01.01.2025, in 2026 unverändert)
    status: ok
    befund: >-
      Geprüft 17.08.2026. Die PAngV-Novelle vom 12.05.2026 stammt aus dem
      Verbraucherkredit-Umsetzungsgesetz und betrifft die Kreditvorschriften der PAngV
      (effektiver Jahreszins u. Ä.). Steakakademie bietet keine Verbraucherkredite/Finanzierung
      an → NICHT einschlägig. §§ 3, 4 PAngV (Gesamtpreisangabe) inhaltlich unverändert.
      Den konkreten Wortlaut von Art. 8 habe ich nicht im Volltext verifiziert — die Einordnung
      stützt sich auf den Regelungskontext des Gesetzes.
    monitor: >-
      Neu prüfen, falls je Ratenzahlung/Finanzierung (z. B. Digistore24-Ratenkauf) angeboten wird —
      dann greifen die geänderten Kredit-Vorschriften der PAngV unmittelbar.

