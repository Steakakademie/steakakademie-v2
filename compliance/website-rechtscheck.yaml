  - id: dse-cookies-consent
    titel: "DSE: Cookies & Einwilligung"
    herkunft: arag-10
    neu: false
    pruefung: "Cookie-Doku in DSE; bei einwilligungspflichtigen Cookies Banner mit gleichwertigem Ablehnen-Button + Widerruf-Mechanismus"
    rechtsgrundlage: "§ 25 TDDDG; Art. 7 Abs. 3 DSGVO"
    status: ok
    befund: >-
      Aktualisiert 10.08.2026 (war 'not-applicable / cookieless' — überholt).
      Seite ist NICHT mehr cookieless: Microsoft Clarity (Heatmaps/Sitzungs-Analyse, setzt Cookies)
      ist eingebunden und lädt ausschließlich nach aktivem Opt-in (ClarityScript prüft
      hasStatisticsConsent). ConsentBanner: zwei gleichwertige Buttons 'Ablehnen'/'Alles akzeptieren'
      (identische Klasse → gleiche Größe UND Farbe, kein Nudging), keine Vorauswahl, kein Schließen
      ohne Wahl. Widerruf jederzeit via Footer 'Cookie-Einstellungen'; bei Widerruf werden
      _cl*/CLID/MUID-Cookies bestmöglich gelöscht. Plausible bleibt cookielos/einwilligungsfrei
      (§ 25 Abs. 2 Nr. 2 TDDDG). DSE § 6 dokumentiert Clarity inkl. Drittlandtransfer.
    monitor: >-
      Meta-Pixel und GA4 sind weiterhin NICHT aktiv (Code-Prüfung 10.08.2026: kein fbq/gtag/GTM).
      Bei Aktivierung: eigene Consent-Kategorie 'Marketing' ergänzen (Statistik-Consent deckt sie nicht).
      Watchpoint Digital Omnibus (DSGVO-Teil, Art. 88a-E DSGVO) — noch nicht verabschiedet,
      würde Cookie-Regeln aus § 25 TDDDG in die DSGVO verlagern.

