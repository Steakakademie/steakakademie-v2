name: Ops-Heartbeat

# Totmannschalter der Automation: prüft Ergebnisse statt Läufe. Für jeden Bereich
# aus data/ops-heartbeat.json die Frage „Wann kam hier zuletzt etwas heraus?".
# Anlass: recipe-grow lief vom 27.08. bis 13.09.2026 jede Nacht grün, ohne ein
# Rezept zu erzeugen. Doku: docs/ops-heartbeat.md · CLAUDE.md Regel 10.
#
# Meldeweg bei Stillstand (in dieser Reihenfolge):
#   1. Job wird rot → GitHub-Fehlermail
#   2. GitHub-Issue mit Label ops-heartbeat — genau eines, wird aktualisiert und
#      bei Besserung automatisch geschlossen
#   3. Jira-Ticket (KAN) über scripts/ops-alert-to-jira.mjs, inkl. Eskalation
#
# Bewusst ohne npm ci: Das Skript nutzt nur Node-Bordmittel. Ein Wächter, der an
# einer kaputten Abhängigkeit scheitert, ist keiner.
on:
  schedule:
    - cron: '0 9 * * *'   # Täglich 09:00 UTC (10:00/11:00 Berlin) — nach allen Nacht-Agenten
  workflow_dispatch:       # + manuell auslösbar

jobs:
  heartbeat:
    name: Liefern die Agenten noch?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # git log über content/…
      actions: read    # Prüf-Typ "workflow": letzte Läufe abfragen
      issues: write    # Stillstands-Issue anlegen/aktualisieren/schließen
    steps:
      - name: Checkout (volle Historie)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Pflicht: Prüf-Typ "git" braucht git log über die ganze Historie

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # continue-on-error, damit Issue und Jira noch laufen. Rot wird der Job im
      # letzten Schritt — nachdem gemeldet wurde.
      - name: Heartbeat prüfen
        id: heartbeat
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ops-heartbeat.mjs

      - name: Stillstand → GitHub-Issue anlegen oder aktualisieren
        if: steps.heartbeat.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          STILL: ${{ steps.heartbeat.outputs.still }}
          BETROFFEN: ${{ steps.heartbeat.outputs.betroffen }}
          BERICHT: ${{ steps.heartbeat.outputs.bericht }}
        with:
          script: |
            const LABEL = 'ops-heartbeat'
            const { owner, repo } = context.repo
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`
            const heute = new Date().toLocaleDateString('de-DE', { timeZone: 'Europe/Berlin', day: '2-digit', month: '2-digit', year: 'numeric' })

            // Keine Ausgabe = das Skript selbst ist abgestürzt, bevor es berichten konnte.
            const abgestuerzt = !process.env.STILL
            const betroffen = abgestuerzt ? 'Heartbeat selbst' : process.env.BETROFFEN
            const titel = abgestuerzt
              ? '⚠️ Ops-Heartbeat selbst fehlgeschlagen'
              : `🔴 Automation steht — ${betroffen}`

            const befunde = abgestuerzt
              ? ['Das Heartbeat-Skript ist abgebrochen, bevor es einen Bericht schreiben konnte. Ursache im Run-Log.']
              : (process.env.BERICHT || '').split(' | ').filter(Boolean)

            const body = [
              `<!-- betroffen: ${betroffen} -->`,
              `## ${abgestuerzt ? '⚠️ Heartbeat fehlgeschlagen' : `🔴 ${process.env.STILL} Bereich(e) ohne Ergebnis`}`,
              '',
              `**Zuletzt geprüft:** ${heute} · [Run-Log mit vollständiger Tabelle](${runUrl})`,
              '',
              '### Befund und was zu tun ist',
              '',
              ...befunde.map(b => `- ${b}`),
              '',
              '---',
              '*Dieses Issue wird bei jedem Lauf aktualisiert und schließt sich selbst, sobald alle Bereiche wieder liefern. Fristen: `data/ops-heartbeat.json` · Doku: `docs/ops-heartbeat.md`*',
            ].join('\n')

            // Label sicherstellen — ohne Label findet der nächste Lauf das Issue nicht wieder.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL })
            } catch (err) {
              if (err.status !== 404) throw err
              await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: 'b60205', description: 'Automation liefert nicht mehr (ops-heartbeat.yml)' })
            }

            const offen = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: LABEL })

            if (offen.data.length === 0) {
              const neu = await github.rest.issues.create({ owner, repo, title: titel, body, labels: [LABEL] })
              core.info(`Neues Issue #${neu.data.number} angelegt.`)
              return
            }

            // Genau eines pflegen. Kommentar nur, wenn sich der Befund ändert —
            // ein täglicher Gleiches-wie-gestern-Kommentar erzieht zum Wegschauen.
            const issue = offen.data[0]
            const vorher = (issue.body || '').match(/<!-- betroffen: (.*?) -->/)?.[1]
            await github.rest.issues.update({ owner, repo, issue_number: issue.number, title: titel, body })
            if (vorher !== betroffen) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `**Befund geändert (${heute}):** vorher „${vorher ?? 'unbekannt'}", jetzt „${betroffen}". [Run-Log](${runUrl})`,
              })
            }
            core.info(`Issue #${issue.number} aktualisiert${vorher !== betroffen ? ' (Befund geändert, kommentiert)' : ''}.`)

      - name: Alles liefert → offenes Issue schließen
        if: steps.heartbeat.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const offen = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'ops-heartbeat' })
            for (const issue of offen.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: '✅ Alle Bereiche liefern wieder. Issue wird automatisch geschlossen.',
              })
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' })
              core.info(`Issue #${issue.number} geschlossen.`)
            }

      - name: Stillstand → Jira-Ticket (KAN, dedup + Eskalation)
        if: steps.heartbeat.outcome == 'failure'
        continue-on-error: true
        env:
          JIRA_BASE_URL: https://steakakademie.atlassian.net
          JIRA_PROJECT_KEY: KAN
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          BETROFFEN: ${{ steps.heartbeat.outputs.betroffen }}
          BERICHT: ${{ steps.heartbeat.outputs.bericht }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_LABELS: 'ops,ci,agent-tech-automation-engineer'
          ALERT_ISSUETYPE: 'Bug'
          ALERT_DEDUP_LABEL: 'ops-heartbeat'
        run: |
          if [ -n "$BETROFFEN" ]; then
            export ALERT_SUMMARY="🔴 Ops-Heartbeat: Automation steht — ${BETROFFEN}"
            export ALERT_DESCRIPTION="${BERICHT} — Run-Log: ${RUN_URL}"
          else
            export ALERT_SUMMARY="⚠️ Ops-Heartbeat selbst fehlgeschlagen"
            export ALERT_DESCRIPTION="Das Heartbeat-Skript ist abgebrochen, bevor es berichten konnte. Run-Log: ${RUN_URL}"
          fi
          node scripts/ops-alert-to-jira.mjs

      - name: Stillstand → Job rot
        if: steps.heartbeat.outcome == 'failure'
        env:
          BETROFFEN: ${{ steps.heartbeat.outputs.betroffen }}
        run: |
          echo "::error::Ops-Heartbeat: ${BETROFFEN:-Heartbeat-Skript selbst fehlgeschlagen} — Details im Job-Summary."
          exit 1
