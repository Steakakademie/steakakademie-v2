name: Build-Guard

# Fängt stille Content-Defekte, die einen "grünen" Build überleben (KAN-29):
#   • Contentlayer-Probleme / stumme Doc-Drops (vgl. KAN-26, CRLF-Rezepte)
#   • Markdown-Tabellen ohne remark-gfm → Pipe-Text (vgl. KAN-28)
# Läuft schnell (kein voller Next-Build). Bei Defekt: rot + automatisches KAN-Ticket.
# Hinweis: blockiert NICHT den Vercel-Deploy (der läuft parallel). Den Merge nach
# main sperrt der Job dagegen sehr wohl: „Stille Content-Defekte prüfen" ist seit
# 04.09.2026 Pflicht-Check der Branch Protection (CLAUDE.md Abschnitt A).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Stille Content-Defekte prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci --ignore-scripts

      - name: Kursinhalte holen (privates Repo)
        run: node scripts/kursinhalte-holen.mjs
        env:
          KURSINHALTE_TOKEN: ${{ secrets.KURSINHALTE_TOKEN }}

      - name: Build-Guard ausführen
        run: node scripts/build-guard.mjs

      # Frontmatter-Gate (KAN-67). Bewusst als eigener Schritt und NACH dem
      # Build-Guard: Beide melden auf dasselbe Ticket, aber im Run-Log soll
      # ablesbar sein, welcher der beiden rot war.
      - name: Frontmatter validieren
        run: node scripts/validate-frontmatter.mjs

      - name: Bei Defekt → Jira-Ticket (KAN)
        if: failure()
        env:
          JIRA_BASE_URL: https://steakakademie.atlassian.net
          JIRA_PROJECT_KEY: KAN
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ALERT_SUMMARY: '🔴 Build-Guard: stille Content-Defekte erkannt'
          ALERT_DESCRIPTION: 'Der Build-Guard hat stille Defekte gefunden — entweder Contentlayer-Probleme bzw. Tabellen ohne remark-gfm (scripts/build-guard.mjs) oder ungueltiges Rezept-Frontmatter (scripts/validate-frontmatter.mjs, KAN-67). Welcher der beiden Schritte rot war, steht im Run-Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          ALERT_LABELS: 'ops,ci,content,agent-tech-automation-engineer'
          ALERT_ISSUETYPE: 'Bug'
          ALERT_DEDUP_LABEL: 'ops-buildguard-failed'
        run: node scripts/ops-alert-to-jira.mjs
