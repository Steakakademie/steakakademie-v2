name: Bilder neu generieren

# Manueller Knopf: generiert Rezept-Hero-Bilder mit der AKTUELLEN Prompt-Doktrin
# NEU (--force überschreibt vorhandene). Nutzt das vorhandene GitHub-Secret FAL_KEY.
# Tipp: erst mit ein paar Test-Slugs starten (Feld "only"), dann alle.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Nur diese Slugs (kommagetrennt, z. B. "ribeye,brisket-texas"). Leer = ALLE Rezepte.'
        required: false
        default: ''

jobs:
  regenerate:
    name: Hero-Bilder neu generieren (FLUX.1 dev, --force)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci --ignore-scripts

      - name: Bilder generieren (--force)
        env:
          IN_ONLY: ${{ inputs.only }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          ARGS="--force"
          if [ -n "$IN_ONLY" ]; then ARGS="$ARGS --only $IN_ONLY"; fi
          echo "Starte: node scripts/recipe-images.mjs $ARGS"
          node scripts/recipe-images.mjs $ARGS

      - name: Geänderte Bilder als PR (Review-Gate, KEIN direkter Push)
        uses: ./.github/actions/pr-statt-push
        with:
          pfade: public/images/rezepte data/bildregister.yaml
          branch-prefix: bot/rezeptbilder
          bot-name: recipe-bot
          commit-message: 'chore(rezepte): Hero-Bilder neu generiert (neue Prompt-Doktrin) — zur Prüfung'
          pr-titel: '🖼 Hero-Bilder neu generiert — bitte jedes Bild prüfen (Regel 8c)'
          pr-body: 'Manuell ausgelöster --force-Lauf (recipe-images.mjs / FLUX). **Jedes Bild einzeln gegen sein Rezept prüfen**, bevor gemergt wird — vorher gingen Bilder ungeprüft live (gleiche Fehlerklasse wie d6b4077).'
          auto-merge: 'false'
          token: ${{ secrets.BOT_PAT || github.token }}

      - name: Bei Fehler → Jira-Ticket (KAN)
        if: failure()
        env:
          JIRA_BASE_URL: https://steakakademie.atlassian.net
          JIRA_PROJECT_KEY: KAN
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ALERT_SUMMARY: '🔴 Bild-Regenerierung fehlgeschlagen'
          ALERT_DESCRIPTION: 'Der manuelle Bild-Regenerierungs-Lauf (regenerate-recipe-images, FLUX) ist abgebrochen. Run-Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          ALERT_LABELS: 'ops,ci,agent-tech-automation-engineer'
          ALERT_ISSUETYPE: 'Bug'
          ALERT_DEDUP_LABEL: 'ops-imageregen-failed'
        run: node scripts/ops-alert-to-jira.mjs
