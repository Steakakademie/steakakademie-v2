name: Content-Gates

# Die Gates aus `npm run check` (KAN-29-Familie):
#   • check-redaktionsvorbehalt.mjs  — ungetaggte Rezepte
#   • check-startseiten-hierarchie.mjs
#   • check-mdx-komponenten.mjs      — unbekannte JSX-Tags in content/
#   • validate-frontmatter.mjs
#   • check-links.mjs                — tote interne Links
#   • check-content-qualitaet.mjs    — Quality-Gate (21.09.2026): Abbrüche, Wort-
#     dopplungen, Fahrenheit-Reste, Kerntemperatur < Sicherheitswert, Tierart-
#     Konflikte, Glossar-Dubletten. Ratchet: Altbestand in
#     data/content-qualitaet-baseline.json blockiert nicht, NEUE Befunde schon.
#     Bewusst NICHT im prebuild (Architektur-Audit 27.08., Regel 5).
#
# STAND 31.08.2026 (Uwe): Die ersten drei laufen wieder im `prebuild` und
# blockieren damit den Vercel-Deploy — der frueher hier stehende Satz "der
# Deploy ruft sie nicht mehr auf" stimmt nicht mehr. Gates aus prebuild
# entfernen ist eine Uwe-Entscheidung, kein Refactoring (CLAUDE.md §4).
# Dieser Workflow bleibt trotzdem sinnvoll: er laeuft auch auf Pull Requests,
# also bevor etwas auf main landet, und deckt zusaetzlich Frontmatter und
# Links ab, die im postbuild erst NACH dem Build greifen.
# Hinweis: dieser Workflow blockiert den Vercel-Deploy nicht (der laeuft
# parallel). Harte Sperre braeuchte Branch-Protection (Admin), vgl.
# build-guard.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: P0-Gates pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci --ignore-scripts

      # Bewusst als ein Schritt: so ist der Workflow genau das, was auch lokal
      # vor dem Commit laeuft. Welches der Gates rot war, steht im Run-Log.
      - name: npm run check
        run: npm run check

  # Rechtschreibung laeuft BEWUSST als eigener Job und BEWUSST nicht blockierend.
  #
  # Warum eigener Job: die Pruefung haengt an der oeffentlichen LanguageTool-API
  # (20 Requests/Minute), das Skript drosselt sich deshalb selbst mit 3,2 s pro
  # Anfrage. Bei einem groesseren Content-Push sind das viele Minuten. Im selben
  # Job wuerde das die P0-Gates hinter sich einreihen und deren 12-Minuten-Fenster
  # sprengen.
  #
  # Warum nicht blockierend: der Korpus ist voller Fachvokabular und
  # Produktnamen — IBBQ, Feedlot, Distillers Grains, Tri-Tip, Mop. Der letzte
  # Lauf meldete 214 Funde, praktisch alle Fehlalarme. Ein Gate, das fast nur
  # Rauschen produziert, wird ignoriert oder abgeschaltet; als Meldung ist es
  # nuetzlich, als Sperre waere es schaedlich.
  #
  # Vorher lief das im postbuild und damit bei jedem Vercel-Deploy mit (Uwe,
  # 31.08.2026: raus). Report-only konnte es den Deploy ohnehin nie retten — es
  # hat nur Build-Zeit gekostet, nachdem efea468 den kaputten API-Aufruf
  # repariert hatte und die Pruefung wieder tatsaechlich lief.
  rechtschreibung:
    name: Rechtschreibung (nur Bericht)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci --ignore-scripts

      # Inkrementell ueber data/spell-check-cache.json: geprueft wird nur, was
      # sich seit dem letzten Lauf geaendert hat. Ohne --strict, Exitcode bleibt
      # 0 auch bei Funden; das `|| true` faengt zusaetzlich einen API-Ausfall ab.
      - name: npm run spell:check
        run: npm run spell:check || true

      # Macht die Zahl in der Job-Summary sichtbar, ohne zu blockieren. Ohne
      # diesen Schritt lag der Befund nur im Artefakt — eine Pruefung, deren
      # Ergebnis niemand oeffnet, ist faktisch abgeschaltet. `if: always()`,
      # weil gerade der Fall "Lauf kam nicht durch" sichtbar sein muss; das
      # Skript beendet sich immer mit 0.
      - name: Zusammenfassung in die Job-Summary
        if: always()
        run: node scripts/spell-check-summary.mjs

      - name: Report als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rechtschreib-report
          path: data/spell-check-report.json
          if-no-files-found: ignore

  # Vision-Stufe fuer Hero-Bilder (21.09.2026). Text-Regeln sehen nicht, dass
  # oberhitzegrill-vergleich eine Seebruecke zeigt — der Alt-Text behauptet das
  # richtige Geraet. Nur Seiten/Bilder, die der PR aendert; ~0,1 Cent pro Bild.
  # Nur Bericht (continue-on-error + Skript ohne --strict): ein Modellurteil ist
  # kein Beweis. Scharf schalten erst mit belegter Trefferquote.
  bild-motiv:
    name: Bild-Motiv (Vision, nur Bericht)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # sharp 0.34 kommt als Prebuilt (@img/sharp-linux-x64), braucht kein
      # Install-Skript — lokal mit --ignore-scripts verifiziert (21.09.2026).
      - name: Dependencies installieren
        run: npm ci --ignore-scripts

      # Bewusst OHNE --strict: der Schritt berichtet nur, Exit bleibt 0. Ein gruenes
      # Haekchen an diesem Job sagt deshalb nichts ueber das Urteil — es steht im
      # Job-Log und in der Step-Summary.
      #
      # --strict ergaenzen (Entscheidung Uwe, 21.09.2026), sobald der Check ueber
      # mindestens ZEHN geaenderte Bilder gelaufen ist und die Trefferquote belegt
      # ist, insbesondere ohne falsch positive Ablehnungen. Wie der Nachweis
      # entsteht — der Report taugt dafuer nicht, er wird je Lauf ueberschrieben
      # und ist gitignored — steht im Kopf von scripts/check-bild-motiv.mjs.
      #
      # BELEGTE LAEUFE (21.–22.09.2026): Lauf 1 (10 Bilder) 5/7 Ablehnungen
      # falsch positiv, Lauf 2 (167 Rezeptbilder) 134 Ablehnungen, Stichprobe
      # 8/8 falsch positiv, Lauf 3 (Stabilitaet) zeigt Nicht-Determinismus bei
      # temperature: 0 — gleiches Bild, gleicher Input, wechselndes Urteil.
      # Bedingung NICHT erfuellt, --strict bleibt deshalb aus, unabhaengig von
      # der Praezision auch wegen der Instabilitaet. Vollstaendige Auswertung:
      # docs/bild-motiv-check-log.md.
      - name: Geaenderte Hero-Bilder pruefen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/check-bild-motiv.mjs --geaendert --basis origin/${{ github.base_ref }}
