name: Glossar wachsen lassen

# Scannt den Content auf neue BBQ-Begriffe, generiert via Claude standardisierte
# Definitionen und legt sie als PR vor (der Build-Lauf erzeugt sie sonst nur
# ephemer pro Deploy).
#
# WIEDER AUTOMATISCH seit 08.10.2026 (Uwe: wichtig fuer SEO) — woechentlich,
# mittwochs 03:00 UTC. Vorher bis 03.10.2026 taeglich; pausiert wurde der Agent,
# weil er 14 Tage gruen ohne einen Begriff lief (Vorrat leer, kein Defekt).
# Diesmal steht die Kontrolle daneben: data/ops-heartbeat.json fuehrt »Glossar«
# (juengste NEU HINZUGEFUEGTE Datei unter content/glossar, 14 Tage) und
# »Glossar-Workflow« (Start, 10 Tage) — CLAUDE.md §2 Regel 10. Liefert der Agent
# weiter nichts, wird der Heartbeat nach 14 Tagen rot: Dann fehlt Nachschub
# (Seed-Liste oder bessere Extraktion, siehe Kopf von scripts/glossary-agent.mjs),
# nicht der Zeitplan. Offen vor Nachschub: docs/glossar-konsolidierung-kandidaten.md
# (182 von 183 Eintraegen unter 150 Woerter) — mehr duenne Eintraege schaden dem SEO.
on:
  schedule:
    - cron: '0 3 * * 3'   # mittwochs 03:00 UTC
  workflow_dispatch:        # + manuell ausloesbar

jobs:
  grow-glossary:
    name: Neue Glossar-Begriffe generieren + committen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # Commit auf Bot-Branch
      pull-requests: write  # PR nach main (Branch Protection seit 01.09.)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci --ignore-scripts

      - name: Glossar-Agent ausführen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/glossary-agent.mjs

      - name: Neue Begriffe als PR (auto-merge nach grünen Gates)
        uses: ./.github/actions/pr-statt-push
        with:
          pfade: content/glossar
          branch-prefix: bot/glossar
          bot-name: glossary-bot
          commit-message: 'chore(glossar): neue/aktualisierte Begriffe (automatisch)'
          pr-titel: '📖 Glossar-Agent: neue Begriffe'
          pr-body: 'Automatisch generiert (scripts/glossary-agent.mjs). Reiner Text — mergt selbst, sobald die Pflicht-Checks grün sind.'
          auto-merge: 'true'
          token: ${{ secrets.BOT_PAT || github.token }}

      - name: Bei Fehler → Jira-Ticket (KAN)
        if: failure()
        env:
          JIRA_BASE_URL: https://steakakademie.atlassian.net
          JIRA_PROJECT_KEY: KAN
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ALERT_SUMMARY: '🔴 Glossar-Agent fehlgeschlagen'
          ALERT_DESCRIPTION: 'Der Glossar-Agent (glossary-grow, woechentlich) ist abgebrochen. Run-Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          ALERT_LABELS: 'ops,ci,agent-tech-automation-engineer'
          ALERT_ISSUETYPE: 'Bug'
          ALERT_DEDUP_LABEL: 'ops-glossary-failed'
        run: node scripts/ops-alert-to-jira.mjs
