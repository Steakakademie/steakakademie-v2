name: Glossar wachsen lassen

# Scannt den Content auf neue BBQ-Begriffe, generiert via Claude standardisierte
# Definitionen und legt sie als PR vor (der Build-Lauf erzeugt sie sonst nur
# ephemer pro Deploy).
#
# PAUSIERT seit 11.10.2026 (Uwe: „Ja, Glossar-Agent pausieren"). Kein Zeitplan, nur
# manueller Start (workflow_dispatch). Grund: Die Search Console zeigt 298 von 408
# URLs als „Gefunden – zurzeit nicht indexiert", davon rund 125 Glossar-Seiten, die
# Google noch nie abgerufen hat. Neue Eintraege verlaengern nur die Warteschlange;
# ausserdem sind 182 von 183 Eintraegen unter 150 Woerter
# (docs/glossar-konsolidierung-kandidaten.md). Der Waechter-Eintrag in
# data/ops-heartbeat.json ist mit dem Zeitplan entfernt (Test: „Zeitplan und
# Waechter-Eintrag gibt es nur gemeinsam"); ein Eintrag ohne Zeitplan wuerde nach
# 14 Tagen jeden Tag Stillstand melden, den niemand beheben soll.
# WIEDER EINSCHALTEN, wenn (1) Google den Grossteil der vorhandenen Glossar-Seiten
# gecrawlt hat (Search Console → Seiten: „Gefunden – nicht indexiert" fuer /glossar
# deutlich unter 50) und (2) die duennen Eintraege konsolidiert oder ausgebaut sind:
# dann `schedule` unten wieder eintragen UND die zwei Eintraege »Glossar« und
# »Glossar-Workflow« in data/ops-heartbeat.json zurueck (Vorlage: Git-Verlauf, PR #347).
# Vorher: wochentlich mittwochs 03:00 UTC (08.10.–11.10.2026), davor taeglich bis 03.10.
on:
  workflow_dispatch:        # nur manuell ausloesbar


jobs:
  grow-glossary:
    name: Neue Glossar-Begriffe generieren + committen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # Commit auf Bot-Branch
      pull-requests: write  # PR nach main (Branch Protection seit 01.09.)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci --ignore-scripts

      - name: Glossar-Agent ausführen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/glossary-agent.mjs

      - name: Neue Begriffe als PR (auto-merge nach grünen Gates)
        uses: ./.github/actions/pr-statt-push
        with:
          pfade: content/glossar
          branch-prefix: bot/glossar
          bot-name: glossary-bot
          commit-message: 'chore(glossar): neue/aktualisierte Begriffe (automatisch)'
          pr-titel: '📖 Glossar-Agent: neue Begriffe'
          pr-body: 'Automatisch generiert (scripts/glossary-agent.mjs). Reiner Text — mergt selbst, sobald die Pflicht-Checks grün sind.'
          auto-merge: 'true'
          token: ${{ secrets.BOT_PAT || github.token }}

      - name: Bei Fehler → Jira-Ticket (KAN)
        if: failure()
        env:
          JIRA_BASE_URL: https://steakakademie.atlassian.net
          JIRA_PROJECT_KEY: KAN
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ALERT_SUMMARY: '🔴 Glossar-Agent fehlgeschlagen'
          ALERT_DESCRIPTION: 'Der Glossar-Agent (glossary-grow, woechentlich) ist abgebrochen. Run-Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          ALERT_LABELS: 'ops,ci,agent-tech-automation-engineer'
          ALERT_ISSUETYPE: 'Bug'
          ALERT_DEDUP_LABEL: 'ops-glossary-failed'
        run: node scripts/ops-alert-to-jira.mjs
